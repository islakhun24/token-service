name: Build & Deploy Token Service

on:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

permissions:
  packages: write
  contents: read

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Login to GHCR
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Extract short SHA
    run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

  - name: Build & Push Image
    uses: docker/build-push-action@v5
    with:
      context: .
      push: true
      tags: |
        ghcr.io/${{ github.repository }}:latest
        ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}

deploy:
runs-on: ubuntu-latest
needs: build

env:
  DOCKER_HOST: ssh://ragillite@103.150.93.47

steps:
  - name: Extract short SHA
    run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

  - name: Setup SSH
    uses: webfactory/ssh-agent@v0.9.0
    with:
      ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

  - name: Disable host key checking
    run: |
      mkdir -p ~/.ssh
      echo -e "Host *\n\tStrictHostKeyChecking no\n" > ~/.ssh/config

  - name: Docker login (GHCR)
    run: |
      echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

  - name: Pull latest image
    run: |
      docker pull ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}

  - name: Stop old container
    run: |
      docker stop token-service || true
      docker rm token-service || true

  - name: Run new container
    run: |
      docker run -d \
        --name token-service \
        -p 9000:8080 \
        --restart=always \
        ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}

  - name: Cleanup unused images
    run: docker system prune -af
