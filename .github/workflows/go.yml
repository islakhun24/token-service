name: Build and Push Docker Image

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}

      - name: Log out from GitHub Container Registry
        run: docker logout ghcr.io

  deploy:
    runs-on: ubuntu-latest
    needs: build
    env:
      DOCKER_HOST: 'ssh://root@103.150.93.47'
    steps:
      - name: Extract short SHA
        id: vars
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Bypass SSH Host Key Checking
        run: |
          mkdir -p ~/.ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config

      - name: Check docker
        run: |
          docker ps -a

      - name: Docker login
        run: |
          docker login -u agil008 -p ${{ secrets.PROD_REGISTRY_PASSWORD }} ghcr.io

      - name: Pull container
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}

      - name: Stop old container
        run: |
          docker stop token-service || true
          docker rm token-service || true

      - name: Run database migration
        run: |
          echo "${{ vars.PROD_ENV_FILE }}" > .env
          docker run --rm --name token-service-migrate --network host --env-file=.env ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }} ./token-service -m=all

      - name: Run new container
        run: |
          docker run -d --name token-service --network host --env-file=.env --restart=always ghcr.io/${{ github.repository }}:${{ env.SHORT_SHA }}

      - name: Cleanup docker images
        run: |
          docker system prune -af
