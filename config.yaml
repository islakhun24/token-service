server:
  port: 8081
  mode: release

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: token_service
  sslmode: disable

binance:
  base_url: https://fapi.binance.com
  ws_url: wss://fstream.binance.com/ws

static_mapping:
  file_path: ./data/tokens.json
  auto_reload: true
  reload_interval: 15m

normalizer:
  aliases:
    XBT: BTC
    1000PEPE: PEPE
    1000SHIB: SHIB
    1000FLOKI: FLOKI
    1000BONK: BONK
    1000LUNC: LUNC
    WETH: ETH
    WBTC: BTC
    WBNB: BNB
    WMATIC: MATIC
    WSOL: SOL

arkham:
  base_url: https://api.intel.arkm.com/v1
  api_key: ""  # set via env ARKHAM_API_KEY

logging:
  level: info
  format: json
